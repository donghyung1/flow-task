[project]
name = "flow-task"
version = "0.1.0"
description = "Task Flow - single-user todo app"
readme = "README.md"
authors = [
    { name = "donghyung1", email = "291482438+donghyung1@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flow-task = "flow_task:main"
flow-task-purge = "flow_task.purge:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["backend"]
