<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Task Flow</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="topbar">
    <button type="button" id="menu-btn" class="icon-btn menu-btn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
    <a class="brand" href="/app/today">Task Flow</a>
    <form id="search-form" class="search-form" role="search" action="/app/search" method="get">
      <label class="sr-only" for="search-input">할 일 검색</label>
      <input id="search-input" type="search" name="q" placeholder="검색 ( / )" autocomplete="off">
    </form>
  </header>
  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="주 메뉴"></nav>
    <main id="main" class="main" tabindex="-1"></main>
    <aside id="detail" class="detail" aria-label="할 일 상세" hidden></aside>
  </div>
  <div id="scrim" class="scrim"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <noscript>이 앱은 JavaScript가 필요합니다.</noscript>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
